<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mood Playlists</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 2rem; max-width: 900px; color:#111; }
    h1 { margin-top: 0; }
    label { display:block; margin:.5rem 0 .25rem; font-weight:600; }
    input, select, button { padding:.5rem; font-size:1rem; }
    .row { display:flex; gap:1rem; align-items:flex-start; flex-wrap:wrap; }
    .stack { display:grid; gap:.5rem; }
    fieldset { border:1px solid #ddd; border-radius:8px; padding:.75rem 1rem; }
    legend { padding:0 .4rem; color:#444; }
    .hidden { display:none !important; }
    #out { margin-top:1rem; padding:1rem; border:1px solid #ddd; border-radius:8px; }
    code { background:#f6f8fa; padding:.2rem .4rem; border-radius:4px; }
    small.hint { color:#555; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    button { border-radius:8px; border:1px solid #ccc; background:#fafafa; cursor:pointer; }
    button:hover { background:#f0f0f0; }

    /* Tags (neutral) */
    .tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .tag { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; border:1px solid #ddd; background:#f7f7f7; }
    .tag button { all:unset; cursor:pointer; font-weight:700; line-height:1; padding:0 4px; }

    /* --- "Same UI" listbox-style checkbox panel --- */
    .selectlike {
      border:1px solid #c7c7c7;
      border-radius:6px;
      background:#fff;
      max-height: 384px; /* ~12 rows, like size="12" */
      overflow:auto;
      padding:0;
    }
    .cb-group { margin:0; border:0; padding:0; }
    .cb-group + .cb-group { border-top:1px solid #eee; }
    .cb-group > legend {
      position: sticky; top: 0; z-index: 1;
      background:#fff; color:#555; font-size:.9rem;
      padding:6px 8px; margin:0; border-bottom:1px dashed #eee;
    }
    .cb-list { list-style:none; margin:0; padding:0; }
    .cb-item { margin:0; }
    .cb-label {
      display:flex; align-items:center; gap:8px;
      height:32px; padding:0 8px;
      cursor:pointer; user-select:none;
      background:transparent;
    }
    .cb-label input { margin:0; }
    .cb-label:hover { background:#f3f4f6; }
    .cb-label.is-checked { background:#e7f0ff; }
    .cb-label:focus-within { outline:2px solid #8cb8ff; outline-offset:-2px; }

    .cb-item.hidden { display:none; }
    .cb-group.hidden { display:none; }
  </style>
</head>
<body>
  <h1>Mood Playlists</h1>

  <!-- Auth UI -->
  <div id="auth" style="margin-bottom:12px; display:flex; align-items:center; gap:.5rem;">
    <a id="loginLink" href="/login">Login with Spotify</a>
    <span id="whoami" style="color:#555;"></span>
    <button id="switchBtn" type="button" style="display:none;">Switch account</button>
    <button id="logoutBtn" type="button" style="display:none;">Sign out</button>
  </div>

  <script>
    const whoamiEl = document.getElementById('whoami');
    const loginLinkEl = document.getElementById('loginLink');
    const logoutBtnEl = document.getElementById('logoutBtn');
    const switchBtnEl = document.getElementById('switchBtn');

    function makeLoginUrl(extraParams = {}) {
      // Build a URL based on the login link, preserving base path
      const url = new URL(loginLinkEl.getAttribute('href'), location.href);
      Object.entries(extraParams).forEach(([k, v]) => url.searchParams.set(k, v));
      return url.toString();
    }

    async function refreshAuthUI() {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        if (!res.ok) throw new Error();
        const me = await res.json();
        whoamiEl.textContent = `Logged in as ${me.display_name || me.id}`;
        loginLinkEl.style.display = 'none';
        logoutBtnEl.style.display = 'inline-block';
        switchBtnEl.style.display = 'inline-block';
      } catch {
        whoamiEl.textContent = '';
        loginLinkEl.style.display = 'inline';
        logoutBtnEl.style.display = 'none';
        switchBtnEl.style.display = 'none';
      }
    }

    async function signOut({ refresh = true } = {}) {
      // Try a few common endpoints; ignore failures and just refresh UI.
      const candidates = [
        { url: '/logout', method: 'POST' },
        { url: '/logout', method: 'GET' },
        { url: '/api/logout', method: 'POST' },
        { url: '/api/logout', method: 'GET' },
        { url: '/auth/logout', method: 'POST' },
      ];
      logoutBtnEl.disabled = true;
      switchBtnEl.disabled = true;

      const originalLogout = logoutBtnEl.textContent;
      const originalSwitch = switchBtnEl.textContent;
      logoutBtnEl.textContent = 'Signing out…';
      switchBtnEl.textContent = 'Switching…';

      try {
        for (const { url, method } of candidates) {
          try {
            const r = await fetch(url, { method, credentials: 'include' });
            if (r.ok) break;
          } catch { /* keep trying */ }
        }
      } finally {
        logoutBtnEl.disabled = false;
        switchBtnEl.disabled = false;
        logoutBtnEl.textContent = originalLogout;
        switchBtnEl.textContent = originalSwitch;
        if (refresh) await refreshAuthUI();
      }
    }

    async function switchAccount() {
      // 1) Sign out locally (clears your app session)
      await signOut({ refresh: false });

      // 2) Redirect to login with hints to force the account chooser.
      //    For Spotify, make sure your backend forwards `show_dialog=true`
      //    to accounts.spotify.com/authorize.
      const url = makeLoginUrl({
        show_dialog: 'true', // Spotify-specific to show the account dialog
        prompt: 'login',     // OIDC hint; harmless if ignored
        switch: '1'          // your server can use this flag if needed
      });
      location.href = url;
    }

    logoutBtnEl.addEventListener('click', () => signOut());
    switchBtnEl.addEventListener('click', switchAccount);

    refreshAuthUI();
  </script>

  <div id="out"></div>

  <script>
    // --- filtering ---
    function filterSelect(selectEl, q) {
      const needle = q.trim().toLowerCase();
      selectEl.querySelectorAll('option').forEach(opt => {
        if (opt.disabled && opt.value === '') { opt.hidden = false; return; } // keep placeholder visible
        const text = opt.textContent.toLowerCase();
        opt.hidden = needle && !text.includes(needle);
      });
    }
    function filterCheckboxes(container, q) {
      const needle = q.trim().toLowerCase();
      container.querySelectorAll('.cb-group').forEach(group => {
        let anyVisible = false;
        group.querySelectorAll('.cb-item').forEach(item => {
          const text = item.dataset.label;
          const visible = !needle || text.includes(needle);
          item.classList.toggle('hidden', !visible);
          if (visible) anyVisible = true;
        });
        group.classList.toggle('hidden', !anyVisible);
      });
    }

    // DOM refs
    const form = document.getElementById('f');
    const out = document.getElementById('out');
    const filter = document.getElementById('mood-filter');

    const singleWrap = document.getElementById('single-wrap');
    const singleSel  = document.getElementById('mood-single');

    const multiWrap  = document.getElementById('multi-wrap');
    const cbContainer = document.getElementById('cb-container');
    const tagsWrap = document.getElementById('mood-multi-tags');

    const modeSingle = document.getElementById('mode-single');
    const modeMulti  = document.getElementById('mode-multi');

    // Build checkbox UI from the single-select's optgroups/options
    function buildCheckboxesFromSelect(selectEl) {
      cbContainer.innerHTML = '';
      selectEl.querySelectorAll('optgroup').forEach(og => {
        const fs = document.createElement('fieldset');
        fs.className = 'cb-group';
        const legend = document.createElement('legend');
        legend.textContent = og.label;
        fs.appendChild(legend);

        const ul = document.createElement('ul');
        ul.className = 'cb-list';

        [...og.querySelectorAll('option')].forEach(opt => {
          if (opt.disabled && opt.value === '') return; // skip placeholder
          const val = opt.value, text = opt.textContent;

          const li = document.createElement('li');
          li.className = 'cb-item';
          li.dataset.value = val;
          li.dataset.label = text.toLowerCase();

          const label = document.createElement('label');
          label.className = 'cb-label';

          const id = 'cb-' + val;
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.name = 'mood';
          input.value = val;
          input.id = id;
          input.disabled = true; // enabled only in multi mode
          input.addEventListener('change', () => {
            label.classList.toggle('is-checked', input.checked);
            renderTags();
          });

          const txt = document.createElement('span');
          txt.className = 'txt';
          txt.textContent = text;

          label.setAttribute('for', id);
          label.appendChild(input);
          label.appendChild(txt);

          li.appendChild(label);
          ul.appendChild(li);
        });

        fs.appendChild(ul);
        cbContainer.appendChild(fs);
      });
    }
    buildCheckboxesFromSelect(singleSel);

    function cbInputs() { return cbContainer.querySelectorAll('input[type="checkbox"][name="mood"]'); }
    function setCheckboxesDisabled(disabled) { cbInputs().forEach(cb => cb.disabled = disabled); }
    function syncRowStates() {
      cbInputs().forEach(cb => {
        cb.closest('.cb-item').querySelector('.cb-label')
          .classList.toggle('is-checked', cb.checked);
      });
    }

    // Tags from checked boxes (neutral)
    function renderTags() {
      tagsWrap.innerHTML = '';
      const checked = [...cbInputs()].filter(cb => cb.checked);
      checked.forEach(cb => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        const labelText = cb.closest('.cb-item').querySelector('.txt').textContent;
        tag.innerHTML = `<span>${labelText}</span><button aria-label="Remove ${labelText}">&times;</button>`;
        tag.querySelector('button').addEventListener('click', () => {
          cb.checked = false;
          syncRowStates();
          renderTags();
        });
        tagsWrap.appendChild(tag);
      });
    }

    // Mode toggle
    function setMode(mode) {
      const isMulti = mode === 'multi';
      singleWrap.classList.toggle('hidden', isMulti);
      multiWrap.classList.toggle('hidden', !isMulti);

      // Enable only active control so FormData submits a single field name "mood"
      singleSel.disabled = isMulti;
      setCheckboxesDisabled(!isMulti);

      // Keep filter applied
      if (isMulti) filterCheckboxes(cbContainer, filter.value);
      else filterSelect(singleSel, filter.value);
    }
    modeSingle.addEventListener('change', () => setMode('single'));
    modeMulti .addEventListener('change', () => setMode('multi'));

    // init UI
    setMode('single');

    // Filtering
    filter.addEventListener('input', () => {
      if (modeMulti.checked) filterCheckboxes(cbContainer, filter.value);
      else filterSelect(singleSel, filter.value);
    });
    document.getElementById('reset-filter').addEventListener('click', () => {
      filter.value = '';
      if (modeMulti.checked) filterCheckboxes(cbContainer, '');
      else filterSelect(singleSel, '');
    });

    // Select all visible (checkbox mode)
    document.getElementById('select-all-visible').addEventListener('click', () => {
      cbContainer.querySelectorAll('.cb-item:not(.hidden) input[type="checkbox"][name="mood"]').forEach(cb => {
        if (!cb.disabled) cb.checked = true;
      });
      syncRowStates();
      renderTags();
    });

    // Clear all (checkbox mode)
    document.getElementById('clear-multi').addEventListener('click', () => {
      cbInputs().forEach(cb => cb.checked = false);
      syncRowStates();
      renderTags();
    });

    // Submit handler (API unchanged)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      out.textContent = 'Creating...';

      // Ensure only active control contributes values
      singleSel.disabled = modeMulti.checked;
      setCheckboxesDisabled(!modeMulti.checked);

      const fd = new FormData(form);
      try {
        const res = await fetch('/api/playlist', {
          method: 'POST',
          body: fd,
          credentials: 'include'
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error || JSON.stringify(data));
        out.innerHTML = `
          <p>Added <b>${data.added}</b> tracks.</p>
          <p>Playlist: <a href="${data.playlist_url}" target="_blank" rel="noopener">open on Spotify</a></p>
          <p>Sample:</p>
          <ul>${(data.sample_titles || []).map(t => `<li>${t}</li>`).join('')}</ul>
          <p>Seeds: <code>${(JSON.stringify(data.used_seeds || {}))}</code></p>
        `;
      } catch (err) {
        out.innerHTML = `<p style="color:#b00">Error: ${err.message}</p>`;
      } finally {
        // Re-enable both for UX
        singleSel.disabled = false;
        setCheckboxesDisabled(false);
      }
    });
  </script>
</body>
